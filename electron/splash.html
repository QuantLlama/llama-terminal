<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciando QuantumLlama</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            -webkit-app-region: drag;
            overflow: hidden;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        .splash-container {
            background: rgba(15, 17, 26, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out;
        }

        .logo-container {
            position: relative;
            margin-bottom: 20px;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0, 195, 255, 0.4));
            animation: pulse 2s infinite ease-in-out;
        }

        .title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 10px 0;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #8fa0bc;
            font-size: 14px;
            margin: 0 0 25px 0;
        }

        .loader {
            width: 150px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .loader::after {
            content: '';
            position: absolute;
            left: -50%;
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, transparent, #00c3ff, transparent);
            border-radius: 4px;
            animation: load 1.5s infinite ease-in-out;
        }

        .status-text {
            color: #5c6c8c;
            font-size: 12px;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes load {
            0% {
                left: -50%;
            }

            100% {
                left: 100%;
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(0.98);
                opacity: 0.9;
            }

            50% {
                transform: scale(1.02);
                opacity: 1;
            }

            100% {
                transform: scale(0.98);
                opacity: 0.9;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="splash-container">
        <div class="logo-container">
            <img class="logo" src="../images/QuantumLLama.ico" alt="QuantumLlama Logo"
                onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMTAiIGhlaWdodD0iMTEwIiB2aWV3Qm94PSIwIDAgMjQgMjQiIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzAwYzNmZiIgc3Ryb2tlLXdpZHRoPSIyIiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiPjxwb2x5Z29uIHBvaW50cz0iMTIgMiAyIDE5IDIyIDE5Ii8+PC9zdmc+';" />
        </div>
        <h1 class="title">QuantumLlama</h1>
        <p class="subtitle">Algorithmic Terminal</p>
        <div class="loader"></div>
        <div class="status-text">Initializing platform…</div>
    </div>
</body>

</html>
