<text x="1058" y="446" class="sans" font-size="13" font-weight="600" fill="#eaf3ff">local_crypto_proxy.py :3128</text>
<text x="1058" y="468" class="mono" font-size="11.5" fill="#8ca3ba">HTTP CONNECT only</text>
<text x="1058" y="485" class="mono" font-size="11.5" fill="#8ca3ba">bound to the tailnet address</text>
<text x="1058" y="502" class="mono" font-size="11.5" fill="#8ca3ba">tailnet is the trust boundary</text>
