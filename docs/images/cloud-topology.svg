<text x="1058" y="223" class="mono" font-size="11.5" fill="#8ca3ba">Windows or Wine</text>
<text x="1058" y="240" class="mono" font-size="11.5" fill="#8ca3ba">one terminal per account</text>
<rect x="1042" y="282" width="304" height="120" rx="12" fill="#0c1724" stroke="#22374d" stroke-width="1.5"/>
<text x="1058" y="308" class="sans" font-size="13" font-weight="600" fill="#eaf3ff">mt5_server.py · bridge :8081</text>
<text x="1058" y="330" class="mono" font-size="11.5" fill="#8ca3ba">GZip · X-Bridge-Token</text>
<text x="1058" y="347" class="mono" font-size="11.5" fill="#8ca3ba">refuses to serve without a token</text>
<text x="1058" y="364" class="mono" font-size="11.5" fill="#8ca3ba">on a non-loopback bind</text>
<text x="1058" y="381" class="mono" font-size="11.5" fill="#8ca3ba">trading access = token access</text>
