<text x="326" y="502" class="sans" font-size="13" font-weight="600" fill="#eaf3ff">Persistent volumes</text>
<text x="326" y="524" class="mono" font-size="11.5" fill="#8ca3ba">config → SQLite, accounts</text>
<text x="326" y="541" class="mono" font-size="11.5" fill="#8ca3ba">outputs → models, reports</text>
<text x="326" y="558" class="mono" font-size="11.5" fill="#8ca3ba">logs → runtime logs</text>
<rect x="594" y="476" width="276" height="116" rx="12" fill="#0c1724" stroke="#22374d" stroke-width="1.5"/>
<text x="610" y="502" class="sans" font-size="13" font-weight="600" fill="#eaf3ff">socat relays (host)</text>
<text x="610" y="524" class="mono" font-size="11.5" fill="#8ca3ba">10.0.0.1:8081 → MT5 bridge</text>
<text x="610" y="541" class="mono" font-size="11.5" fill="#8ca3ba">10.0.0.1:3128 → CONNECT proxy</text>
