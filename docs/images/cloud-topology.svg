<text x="310" y="628" class="mono" font-size="11.5" fill="#6f8299">no torch in the image · WITH_TORCH=true is opt-in · runs as uid 10001</text>
<text x="310" y="650" class="mono" font-size="11.5" fill="#6f8299">QUANTUM_LLAMA_KEY_DIR=/app/config/keys keeps key material writable</text>
