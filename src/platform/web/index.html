  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;
    const SUPABASE_URL = "https://skggzqwwszhepwqnkrtv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_FtfAr8PLv87qSZgLHtAILQ_EB1X5UJK";
    const isPopoutMode = new URLSearchParams(window.location.search).get("popout") === "true";
    window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {

    // const PlatformLoader = window.PlatformLoader;
    const DashboardModals = window.DashboardModals;
    const SettingsModal = window.SettingsModal;
    const EconomicCalendar = window.EconomicCalendar;
    const TechnicalAnalysisModal = window.TechnicalAnalysisModal;
    const CandleTimer = window.CandleTimer;
    const AlgoLab = window.AlgoLab;
    const useTradeStream = window.useTradeStream;
    const TapeConfigModal = window.TapeConfigModal;
    const TapePanel = window.TapePanel;

    const getDefaultChartSettings = window.getDefaultChartSettings;
    const ChartSettingsModal = window.ChartSettingsModal;
    const ErrorBoundary = window.ErrorBoundary;
    const ChartComponent = window.ChartComponent;
    const WorkspacesModal = window.WorkspacesModal;
    const useConfig = (
      key,
      defaultValue = null,
      category = "general") => {
      const [value, setValue] = useState(() => {
        return (
          window.configDB?.getSync(key, defaultValue) ||
          defaultValue);
      });
      const [isLoading, setIsLoading] = useState(true);
      useEffect(() => {
        if (window.configDB) {
          window.configDB.
            get(key, defaultValue).
            then((dbValue) => {
              setValue(dbValue);
              setIsLoading(false);
            });
        } else {
          setIsLoading(false);
        }
      }, [key, defaultValue]);
      const updateValue = async (newValue) => {
        setValue(newValue);
        if (window.configDB) {
          await window.configDB.set(key, newValue, category);
        }
      };
      return [value, updateValue, isLoading];
    };
    const playBellSound = () => {
      const audio = new Audio("/sound/bell.mp3");
      audio.volume = 1.0;
      audio.play().catch((e) => {
        console.warn(
          "Could not play bell.mp3 (checking fallback):",
          e
        );
        try {
          const audioContext = new (
            window.AudioContext || window.webkitAudioContext)(
          );
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(
            800,
            audioContext.currentTime
          );
          oscillator.frequency.exponentialRampToValueAtTime(
            400,
            audioContext.currentTime + 0.5
          );
          gainNode.gain.setValueAtTime(
            0.3,
            audioContext.currentTime
          );
          gainNode.gain.exponentialRampToValueAtTime(
            0.01,
            audioContext.currentTime + 1.5
          );
          oscillator.start(audioContext.currentTime);
          oscillator.stop(audioContext.currentTime + 1.5);
        } catch (oscError) {
          console.warn(
            "Could not play fallback sound:",
            oscError
          );
        }
      });
    };
    let lastSession = null;
    let sessionCheckInterval = null;
    window.marketSessionCache = {};
    const getMarketSession = async (symbol = "SPY") => {
      const now = Date.now();
      const cached = window.marketSessionCache[symbol];
      if (cached && now - cached.timestamp < 10000) {
        return cached.data;
      }
      if (cached && cached.pending) {
        return cached.pending;
      }
      const fetchTask = (async () => {
        try {
          const response = await fetch(
            `/api/market/session?symbol=${encodeURIComponent(symbol)}`
          );
          const data = await response.json();
          if (data.server_time) {
            const serverTime = new Date(data.server_time);
            const localTime = new Date();
            window.serverTimeOffset = serverTime - localTime;
          }
          if (data.session && lastSession) {
            const isNYMarket =
              data.market_type === "stocks" ||
              data.market_type === "futures";
            if (isNYMarket && lastSession !== "REGULAR" && data.session === "REGULAR") {
              playBellSound();
            }
            if (isNYMarket && lastSession === "REGULAR" && data.session !== "REGULAR" && data.session !== "PRE_MARKET") {
              playBellSound();
            }
          }
          lastSession = data.session;
          const sessionMap = {
            CRYPTO: { session: "CRYPTO", color: "bg-green-500", isOpen: true, description: "Crypto Market (24/7)" },
            PRE_MARKET: { session: "PRE-MARKET", color: "bg-orange-500", isOpen: true, description: "Pre-Market (ET)" },
            REGULAR: { session: "NY", color: "bg-green-500", isOpen: true, description: "New York Session (ET)" },
            AFTER_HOURS: { session: "AFTER-HOURS", color: "bg-blue-500", isOpen: true, description: "After-Hours (ET)" },
            ASIAN: { session: "ASIAN", color: "bg-yellow-500", isOpen: true, description: "Asian Session" },
            LONDON: { session: "LONDON", color: "bg-blue-500", isOpen: true, description: "London Session" },
            NEW_YORK: { session: "NY", color: "bg-green-500", isOpen: true, description: "New York Session" },
            CLOSED: { session: "CLOSED", color: "bg-red-500", isOpen: false, description: "Market Closed" },
            UNKNOWN: { session: "UNKNOWN", color: "bg-gray-500", isOpen: false, description: "Status Unknown" }
          };
          const result = sessionMap[data.session] || sessionMap["UNKNOWN"];
          window.marketSessionCache[symbol] = {
            data: result,
            timestamp: Date.now(),
            pending: null
          };
          return result;
        } catch (error) {
          console.error("Error fetching market session:", error);
          return {
            session: "UNKNOWN",
            color: "bg-gray-500",
            isOpen: false,
            description: "Status Unknown"
          };
        }
      })();
      window.marketSessionCache[symbol] = {
        ...cached,
        pending: fetchTask
      };
      return await fetchTask;
    };
    const startSessionPolling = () => {
      if (sessionCheckInterval) {
        clearInterval(sessionCheckInterval);
      }
      const performCheck = async () => {
        const currentSymbol = window.activeSymbol || "SPY";
        await getMarketSession(currentSymbol);
      };
      performCheck();
      sessionCheckInterval = setInterval(performCheck, 30000);
    };
    window.availableSymbols = {
      mt5: []
    };
    const fetchAvailableSymbols = async (platform) => {
      try {
        const response = await fetch(`/api/symbols?platform=${platform}`);
        if (response.ok) {
          const symbols = await response.json();
          window.availableSymbols[platform] = symbols;
          window.dispatchEvent(new CustomEvent('symbols-updated', { detail: { platform, symbols } }));
          return symbols;
        }
      } catch (e) {
        console.error(`Error fetching symbols for ${platform}:`, e);
      }
      return [];
    };
    window.fetchAvailableSymbols = fetchAvailableSymbols;
    const getUniversalSymbol = (symbol, platform = null) => {
      if (!symbol) return "";
      let s = symbol.toString().toUpperCase();
      const p = platform || window.detectPlatformType(s);

      if (p === "crypto") {
        // Normalize BTC-USDT or BTC/USDT:USDT to BTCUSDT
        let clean = s.split(':')[0].replace(/[-\/]/g, '');
        return clean.trim();
      }

      if (s.includes(" ") && (s.includes("-2") || s.includes("-0") || s.includes(" MAR") || s.includes(" JUN") || s.includes(" SEP") || s.includes(" DEC"))) {
        s = s.replace(/ /g, "").replace(/-/g, "");
      }
      return s.trim();
    };
    const detectPlatformType = (symbol = null) => {
      const params = new URLSearchParams(window.location.search);
      const urlPlatform = params.get("platform");
      if (urlPlatform && ["mt5", "nt8", "crypto", "tradovate"].includes(urlPlatform)) {
        return urlPlatform;
      }

      const sym = (symbol || window.activeSymbol || "").toUpperCase();

      // Prioritize Symbol-based detection if it matches known Crypto patterns
      if (sym.includes("USDT") || sym.includes("USDC") || sym.includes("/") || sym.includes("ETH-") || sym.includes("BTC-") ||
        sym.includes("SOL-") || sym.includes("XRP-") || sym.includes("BNB-")) {
        return "crypto";
      }

      // Known MT5/Futures symbols (NQ, ES, MNQ, MES, CL, GC, etc.)
      if (sym.startsWith("MNQ") || sym.startsWith("NQ") || sym.startsWith("ES") || sym.startsWith("MES") ||
        sym.startsWith("CL") || sym.startsWith("GC") || sym.startsWith("YM") || sym.startsWith("RTY") ||
        sym.includes("=F") || sym.includes(".V") || sym.includes(".M")) {
        return "mt5";
      }

      const selectedPlatform = localStorage.getItem("platform") || localStorage.getItem("broker_platform");
      if (selectedPlatform && ["mt5", "nt8", "crypto", "tradovate"].includes(selectedPlatform)) {
        return selectedPlatform;
      }

      return "mt5";
    };
    window.getUniversalSymbol = getUniversalSymbol;
    window.detectPlatformType = detectPlatformType;
    window.cleanSymbol = (symbol) => {
      if (!symbol) return "";
      let s = symbol.toString();
      if (s.includes(':')) s = s.split(':')[0];
      return s;
    };
    (function () {
      const originalError = console.error;
      console.error = function (...args) {
        if (args[0] && typeof args[0] === "string") {
          if (
            args[0].includes("MetaMask") ||
            args[0].includes("inpage.js"))
            return;
        }
        if (
          args[0] &&
          args[0].message && (
            args[0].message.includes("MetaMask") ||
            args[0].message.includes("extension not found")))
          return;
        originalError.apply(console, args);
      };
    })();
    window.getSymbolPrecision = (symbol, platform = null, price = 0) => {
      if (!symbol) return { digits: 5, tick_size: 0.00001 };
      const p = platform || window.detectPlatformType(symbol);
      const upperSymbol = symbol.toUpperCase();
      if (window.activeSymbolMetadata && (window.activeSymbolMetadata.symbol === symbol || window.activeSymbolMetadata.id === symbol)) {
        return {
          digits: window.activeSymbolMetadata.digits,
          tick_size: window.activeSymbolMetadata.tick_size
        };
      }
      if (p === "crypto") {
        const isPremium = upperSymbol.includes("BTC") || upperSymbol.includes("ETH") ||
          upperSymbol.includes("USDT") || upperSymbol.includes("USD") ||
          price > 100;
        if (isPremium) {
          return { digits: 2, tick_size: 0.01 };

  <script type="module">
    const DB_NAME = "QuantumLlamaConfig";
    const DB_VERSION = 1;
    const STORE_NAME = "settings";
    class ConfigDB {
      constructor() {
        this.db = null;
        this.cache = new Map();
        this.initPromise = this.init();
      }
      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => {
            this.db = request.result;
            this.loadCache().then(resolve);
          };
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              const store = db.createObjectStore(STORE_NAME, {
                keyPath: "key"
              });
              store.createIndex("category", "category", {
                unique: false
              });
              store.createIndex("timestamp", "timestamp", {
                unique: false
              });
            }
          };
        });
      }
      async loadCache() {
        await this.initPromise;
        return new Promise((resolve) => {
          const transaction = this.db.transaction(
            [STORE_NAME],
            "readonly"
          );
          const store = transaction.objectStore(STORE_NAME);
          const request = store.getAll();
          request.onsuccess = () => {
            request.result.forEach((item) => {
              this.cache.set(item.key, item.value);
            });
            resolve();
          };
          request.onerror = () => resolve();
        });
      }
      async get(key, defaultValue = null) {
        if (this.cache.has(key)) {
          return this.cache.get(key);
        }
        await this.initPromise;
        return new Promise((resolve) => {
          const transaction = this.db.transaction(
            [STORE_NAME],
            "readonly"
          );
          const store = transaction.objectStore(STORE_NAME);
          const request = store.get(key);
          request.onsuccess = () => {
            const value = request.result ?
              request.result.value :
              defaultValue;
            this.cache.set(key, value);
            resolve(value);
          };
          request.onerror = () => resolve(defaultValue);
        });
      }
      getSync(key, defaultValue = null) {
        return this.cache.has(key) ?
          this.cache.get(key) :
          defaultValue;
      }
      async set(key, value, category = "general") {
        await this.initPromise;
        this.cache.set(key, value);
        return new Promise((resolve) => {
          const transaction = this.db.transaction(
            [STORE_NAME],
            "readwrite"
          );
          const store = transaction.objectStore(STORE_NAME);
          const request = store.put({
            key,
            value,
            category,
            timestamp: Date.now()
          });
          request.onsuccess = () => resolve();
          request.onerror = () => resolve();
        });
      }
      async delete(key) {
        await this.initPromise;
        this.cache.delete(key);
        return new Promise((resolve) => {
          const transaction = this.db.transaction(
            [STORE_NAME],
            "readwrite"
          );
          const store = transaction.objectStore(STORE_NAME);
          const request = store.delete(key);
          request.onsuccess = () => resolve();
          request.onerror = () => resolve();
        });
      }
      async migrateFromLocalStorage() {
        const keysToMigrate = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key) {
            keysToMigrate.push(key);
          }
        }
        let migrated = 0;
        for (const key of keysToMigrate) {
          const value = localStorage.getItem(key);
          if (value !== null) {
            try {
              const parsed = JSON.parse(value);
              await this.set(
                key,
                parsed,
                this.getCategoryFromKey(key)
              );
              migrated++;
            } catch (e) {
              await this.set(
                key,
                value,
                this.getCategoryFromKey(key)
              );
              migrated++;
            }
          }
        }
      }
      getCategoryFromKey(key) {
        if (key.includes("show_") || key.includes("visible"))
          return "visibility";
        if (key.includes("color")) return "colors";
        if (key.includes("drawing")) return "drawings";
        if (key.includes("workspace")) return "workspaces";
        if (key.includes("cazastop") || key.includes("algo"))
          return "indicators";
        if (key.includes("layout") || key.includes("size"))
          return "layout";
        return "general";
      }
    }
    window.configDB = new ConfigDB();
    window.configDB.initPromise.
      then(async () => {
        const migrated = await window.configDB.get(
          "_migration_completed",
          false
        );
        if (!migrated && localStorage.length > 0) {
          await window.configDB.migrateFromLocalStorage();
          await window.configDB.set(
            "_migration_completed",
            true,
            "system"
          );
        }
      }).
      catch((err) => {
        console.error("❌ ConfigDB initialization failed:", err);
        console.warn("⚠️ Falling back to localStorage");
      });
  </script>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get("purge") || params.get("force_refresh")) {
        localStorage.removeItem("broker_platform");
        localStorage.removeItem("available_symbols");
      }
      if (typeof startSessionPolling === "function") {
        startSessionPolling();
      }
    })();
    window.addEventListener("keydown", (e) => {
      if (
        e.key === "F5" ||
        e.ctrlKey && e.key.toLowerCase() === "r" ||
        e.metaKey && e.key.toLowerCase() === "r") {
        e.preventDefault();
        const currentUrl = new URL(window.location.href);
        currentUrl.searchParams.set("force_refresh", Date.now());
        currentUrl.searchParams.set(
          "v",
          Math.random().toString(36).substring(7)
        );
        window.location.replace(currentUrl.toString());
      }
    });
  </script>
