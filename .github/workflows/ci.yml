name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.ci.txt

      - name: Run the minimal suite with source coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: >-
          python -m coverage run -m pytest -q
          --ignore=tests/test_model_artifact_contract.py
          --ignore=tests/test_simulation_compatibility.py

      - name: Generate coverage reports
        if: always()
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          python -m coverage xml -o "$RUNNER_TEMP/coverage.xml"
          python -m coverage report -m > "$RUNNER_TEMP/coverage.txt"
          cat "$RUNNER_TEMP/coverage.txt"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/coverage.xml
            ${{ runner.temp }}/coverage.txt
          if-no-files-found: error
          retention-days: 14

  model-simulation:
    name: CPU model and simulation seams (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.ci.txt
            requirements.txt
            .github/workflows/ci.yml

      - name: Install bounded CPU seam dependencies
        run: |
          python -m pip install -r requirements.ci.txt scikit-learn==1.4.2 yfinance==0.2.40
          python -m pip install torch==2.2.2 --index-url https://download.pytorch.org/whl/cpu

      - name: Require the real CPU model stack
        run: |
          python -c "import numpy, pandas, sklearn, torch; assert not torch.cuda.is_available(); assert torch.version.cuda is None"

      - name: Run artifact and simulation contracts with source coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: >-
          python -m coverage run -m pytest -q
          tests/test_model_artifact_contract.py
          tests/test_simulation_compatibility.py

      - name: Generate coverage reports
        if: always()
        env:
          COVERAGE_FILE: ${{ runner.temp }}/.coverage
        run: |
          python -m coverage xml -o "$RUNNER_TEMP/coverage.xml"
          python -m coverage report -m > "$RUNNER_TEMP/coverage.txt"
          cat "$RUNNER_TEMP/coverage.txt"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-model-simulation-python-3.11
          path: |
            ${{ runner.temp }}/coverage.xml
            ${{ runner.temp }}/coverage.txt
          if-no-files-found: error
          retention-days: 14

  static:
    name: Syntax, conflict markers and documentation links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile the Python entry points
        run: |
          python -m compileall -q run.py train.py mt5_server.py src tests scripts
          echo "python sources compile"

      - name: Check Electron entry point syntax when Node is available
        run: |
          if command -v node >/dev/null 2>&1; then
            node --check electron/main.js
            node --check electron/health.js
          else
            echo "::warning::Node unavailable; Electron syntax was not checked"
          fi

      - name: Reject merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>|=======$)' -- '*.py' '*.js' '*.jsx' '*.md' '*.json' '*.yml' '*.yaml'; then
            echo "::error::Merge conflict markers found"
            exit 1
          fi
          echo "no conflict markers"

      - name: Reject committed secrets
        run: python scripts/check_secrets.py

      - name: Check documentation links
        run: python scripts/check_docs_links.py

  commit-hygiene:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$PR_TITLE" | grep -qE "$pattern"; then
            echo "::error::Pull request title must follow Conventional Commits: $PR_TITLE"
            exit 1
          fi
          echo "title ok: $PR_TITLE"
